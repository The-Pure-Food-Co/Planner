<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pure Planner">
  <!-- Calendar + checklist mark: simplified to hold together at favicon size —
       a single rounded tile, one bold calendar frame, and a checkmark, no
       thin ruled lines or small typographic date numerals that would mush. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93328E"/>
      <stop offset="0.55" stop-color="#C63663"/>
      <stop offset="1" stop-color="#F8485E"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#tile)"/>

  <!-- Calendar body -->
  <rect x="120" y="146" width="272" height="240" rx="32" fill="#FFFFFF"/>
  <!-- Header band -->
  <path d="M120 178a32 32 0 0 1 32-32h208a32 32 0 0 1 32 32v34H120z" fill="#943152"/>
  <!-- Hanging rings -->
  <rect x="168" y="112" width="28" height="56" rx="14" fill="#FFFFFF"/>
  <rect x="316" y="112" width="28" height="56" rx="14" fill="#FFFFFF"/>

  <!-- Checkmark -->
  <path d="M182 288l48 48 100-104" fill="none" stroke="#943152" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
